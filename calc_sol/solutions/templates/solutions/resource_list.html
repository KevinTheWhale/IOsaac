<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources - IOsaac</title>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* Prevent horizontal scroll */
        }

        .top-section {
            width: 100%;
            height: 20vh;
            background-color: #86d3ad;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 80px;
            font-weight: 900;
            color: #eff5f2;
            text-shadow: -3px -3px 0 #4b7f63, 3px -3px 0 #4b7f63, -3px 3px 0 #4b7f63, 3px 3px 0 #4b7f63;
            text-decoration: none;
            letter-spacing: 5px;
            margin-right: 50px;
        }

        .button-container {
            display: flex;
            gap: 20px;
        }

        .nav-button {
            background-color: #86d3ad;
            color: #4b7f63;
            font-size: 24px;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid #86d3ad;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s;
        }

        .nav-button:hover {
            background-color: #cbf3de;
            transform: scale(1.05);
        }

        /* Upload Button Styling */
        .upload-button {
            position: absolute;         /* Keeps the button within the top-section */
            right: 60px;                 /* Stays on the far right */
            top: var(--upload-button-top, 50%);  /* Adjustable vertical position */
            transform: translateY(-50%); /* Centered vertically based on the top value */
            background-color: #63a984;
            color: #eff5f2;
            font-size: 24px;
            font-weight: bold;
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .upload-button:hover {
            background-color: #cbf3de;
        }

        .divider-line {
            width: 100%;
            height: 6px;
            background-color: #63a984;
            margin: 0;
            border: none;
        }

        .content-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 40px auto;
            width: 80%;
            max-width: 1200px;
        }

        .content-section {
            width: 100%;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f992;
            border-radius: 12px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .content-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .resource-list {
            margin-top: 20px;
        }

        .resource-item {
            margin-bottom: 20px;
        }

        .resource-link {
            display: block;
            padding: 10px 20px;
            background-color: #86d3ad;
            color: #4b7f63;
            text-decoration: none;
            border-radius: 12px;
            width: 300px;
            margin: 0 auto;
            transition: background 0.3s, transform 0.2s;
        }

        .resource-link:hover {
            background-color: #cbf3de;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- Top Section with Navigation -->
    <div class="top-section">
        <div>
            <a href="/" class="logo">Φsaac</a>
        </div>
        <div class="button-container">
            <a href="/" class="nav-button">Home</a>
            <a href="{% url 'chapter_list' %}" class="nav-button">Solutions</a>
            <a href="/resources" class="nav-button">Resources</a>
            <a href="/about" class="nav-button">About</a>
            <a href="/feedback" class="nav-button">Feedback</a>
        </div>
        
        <!-- Dedicated Upload Button -->
        <a href="/upload" class="upload-button" style="--upload-button-top: 10%;">UPLOAD</a>

    </div>

    <!-- Divider Line -->
    <div class="divider-line"></div>

    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <div class="content-section">
            <div class="content-title">Available Resources</div>
            <div class="resource-list">
                {% for resource in resources %}
                    <div class="resource-item">
                        <a href="{% url 'resource_detail' resource.id %}" class="resource-link">{{ resource.title }}</a>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
