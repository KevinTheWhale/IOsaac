<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - IOsaac</title>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* Prevent horizontal scroll */
        }
        .top-section {
            width: 100%;
            height: 20vh;
            background-color: #86d3ad;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }
        .logo {
            font-size: 80px; /* Increased size for higher definition */
            font-weight: 900; /* Extra bold for sharp definition */
            color: #eff5f2;
            text-shadow: -3px -3px 0 #4b7f63, 3px -3px 0 #4b7f63, -3px 3px 0 #4b7f63, 3px 3px 0 #4b7f63;
            text-decoration: none;
            letter-spacing: 5px; /* More spacing for readability */
            font-smooth: always;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            margin-right: 50px; /* Pushes the buttons to the right of the logo*/
        }
        .logo:visited, .logo:active, .logo:hover, .logo:link {
            text-decoration: none;
        }

        .logo-text {
            font-size: 15px;
            font-weight: 600;
            color: #eff5f2; /* Same color as the logo for consistency */
            margin-top: 5px; /* Adds a little spacing between the logo and the text */
        }
        .button-container {
            display: flex;
            gap: 20px;
        }
        .nav-button {
            background-color: #86d3ad;
            color: #4b7f63;
            font-size: 24px;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid #86d3ad;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s;
        }
        .nav-button:hover {
            background-color: #cbf3de;
            transform: scale(1.05);
        }

        /* Upload Button Styling */
        .upload-button {
            position: absolute;         /* Keeps the button within the top-section */
            right: 60px;                 /* Stays on the far right */
            top: var(--upload-button-top, 50%);  /* Adjustable vertical position */
            transform: translateY(-50%); /* Centered vertically based on the top value */
            background-color: #63a984;
            color: #eff5f2;
            font-size: 24px;
            font-weight: bold;
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .upload-button:hover {
            background-color: #cbf3de;
        }
        .content-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 40px auto;
            width: 80%;
            max-width: 1200px;
        }
        .content-section {
            width: 100%;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f992;
            border-radius: 12px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        .ad-space {
            width: 10%;
            height: 300px;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            background-color: #f1f1f1;
            margin: 0;
        }

        /* Divider Line Styling */
        .divider-line {
            width: 100%;
            height: 6px;  /* Thickness of the line */
            background-color: #63a984;  /* A nice blue color, but you can change this */
            margin: 0;
            border: none;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #4b7f63;
        }

        
        .submit-button {
            background-color: #63a984;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        .submit-button:hover {
            background-color: #cbf3de;
        }
        .error-message {
            color: red;
            margin-top: 10px;
        }


    </style>
</head>
<body>
    <div class="top-section">
        <div>
            <a href="/" class="logo">Φsaac</a>
        </div>
        <div class="button-container">
            <a href="/" class="nav-button">Home</a>
            <a href="{% url 'chapter_list' %}" class="nav-button">Solutions</a>
            <a href="/resources" class="nav-button">Resources</a>
            <a href="/about" class="nav-button">About</a>
            <a href="/feedback" class="nav-button">Feedback</a>
        </div>

       <!-- Dedicated Upload Button -->
       <a href="/upload" class="upload-button" style="--upload-button-top: 10%;">UPLOAD</a>
    </div>

    <!-- Divider Line -->
    <div class="divider-line"></div>
    
    <div class="content-wrapper">
        <div class="ad-space">Ad Space</div>
        <div class="content-section">
            <h2>Submit Your Feedback</h2>
            <form method="POST">
                {% csrf_token %}
                <label for="id_content">Your Feedback:</label><br>
                <textarea id="id_content" name="content" rows="10" maxlength="10000" style="width:100%; padding:10px; font-size:16px;"></textarea>
                <div id="word-count" style="margin-top: 10px; font-weight: bold;">
                    0 / 1000
                </div>
                <button type="submit" class="submit-button">Submit</button>
            </form>
            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}
        </div>
        <div class="ad-space">Ad Space</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const textarea = document.getElementById('id_content');
            const counter = document.getElementById('word-count');
            const maxWords = 1000;
        
            textarea.addEventListener('input', () => {
                const words = textarea.value.trim().split(/\s+/).filter(Boolean);
                const count = words.length;
                counter.textContent = `${count} / ${maxWords}`;
                
                if (count > maxWords) {
                    counter.style.color = 'red';
                } else {
                    counter.style.color = 'black';
                }
            });
        });
        </script>
        
</body>
</html>
